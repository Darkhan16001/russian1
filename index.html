
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>А. П. Чехов — Жизнь и творчество</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <strong>РУССКАЯ ЛИТЕРАТУРА</strong>
      <small>А. П. Чехов · Интерактивный урок</small>
    </div>
  </div>

  <div class="clocks">
    <div>
      <small>ТАЙМЕР УРОКА</small>
      <b id="timer">00:00</b>
    </div>

    <div>
      <small>АЛМАТЫ · UTC+5</small>
      <b id="clock">--:--:--</b>
    </div>
  </div>
</header>

<div class="workspace">

  <aside class="sidebar">
    <div class="side-title">УПРАВЛЕНИЕ</div>

    <div id="counter" class="counter">01 / 01</div>

    <div class="progress">
      <div id="progressFill"></div>
    </div>

    <button id="nextButton" class="primary"
            onclick="nextSlide()">
      Далее →
    </button>

    <button onclick="previousSlide()">
      ← Назад
    </button>

    <button onclick="goHome()">
      ⌂ Главная
    </button>

    <button onclick="toggleFullscreen()">
      ⛶ Весь экран
    </button>

    <button id="timerButton" onclick="toggleTimer()">
      ▶ Таймер
    </button>

    <button onclick="resetTimer()">
      ↻ Сброс
    </button>

    <div class="side-bottom">
      <small>РАЗДЕЛ УРОКА</small>
      <strong id="sectionName">Введение</strong>
      <p>BY DARKHAN</p>
    </div>
  </aside>

  <main id="stage" class="stage">
    <article id="screen" class="screen"></article>
  </main>

</div>

</body>
</html>
